<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EthioStudy — Ethiopian Grade 10 & 11 Study System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="particleCanvas" aria-hidden="true"></canvas>

<!-- Sticky mini-timer bar: appears at top when a session runs -->
<div id="miniTimerBar" class="mini-timer-bar" hidden>
  <span class="mini-timer-icon">⏱️</span>
  <span class="mini-timer-topic" id="miniTimerTopic">Studying…</span>
  <span id="miniTimerDisplay" class="mini-timer-time">00:00</span>
  <button id="miniTimerToggle" class="mini-timer-btn">⏸</button>
  <button id="miniTimerFinish" class="mini-timer-btn mini-timer-finish">✓</button>
</div>

<div id="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">🎓</div>
      <div class="brand-text">
        <div class="brand-name">Ethio<span>Study</span></div>
        <div class="brand-sub">Grade 10–11 · New Curriculum</div>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
    </div>

    <button class="btn btn-primary btn-big-pick" id="navPickTopic">
      <span class="dice">🎲</span> <span data-i18n="pickTopic">PICK A TOPIC</span>
    </button>

    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">🏠</span><span data-i18n="dashboard">Dashboard</span></button>
      <button class="nav-item" data-view="browse"><span class="nav-ico">📚</span><span data-i18n="browse">Browse Curriculum</span></button>
      <button class="nav-item" data-view="practice"><span class="nav-ico">🧠</span><span data-i18n="practice">Practice</span></button>
      <button class="nav-item" data-view="exam"><span class="nav-ico">📝</span><span data-i18n="exam">Exam Prep</span></button>
      <button class="nav-item" data-view="progress"><span class="nav-ico">📈</span><span data-i18n="progress">Progress</span></button>
      <button class="nav-item" data-view="bookmarks"><span class="nav-ico">🔖</span><span data-i18n="bookmarks">Bookmarks</span></button>
      <button class="nav-item" data-view="notes"><span class="nav-ico">📒</span><span data-i18n="notes">Notes</span></button>
      <button class="nav-item" data-view="settings"><span class="nav-ico">⚙️</span><span data-i18n="settings">Settings</span></button>
    </nav>

    <div class="sidebar-foot">
      <div id="streakPill" class="streak-pill">🔥 0 day streak</div>
      <div class="sidebar-time" id="sidebarTime">—</div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <div class="searchbox">
        <span class="search-ico">🔍</span>
        <input type="search" id="globalSearch" placeholder="Search topics, definitions, formulas…" autocomplete="off">
      </div>
      <button class="language-toggle" id="languageToggle" aria-label="Switch interface language" title="Switch interface language"><span>EN</span><span class="language-divider">/</span><span>አማ</span></button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark">🌙</button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<div id="searchPanel" class="search-panel" hidden></div>
<div id="modalRoot"></div>
